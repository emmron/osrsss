<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ardenvale</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: absolute; width: 765px; height: 503px; transform-origin: 0 0; }
  #wrap canvas { position: absolute; }
  #ui { image-rendering: pixelated; }
  #gl { left: 4px; top: 4px; width: 512px; height: 334px; image-rendering: pixelated; image-rendering: crisp-edges; }
  #ui { left: 0; top: 0; width: 765px; height: 503px; cursor: default; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* invisible text box: gives phones a keyboard for the username, chat and amount prompts */
  #kbform { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  #kb { font-size: 16px; width: 200px; }
  /* real text fields laid over the canvas: tapping them always opens the phone keyboard */
  .ovf { position: absolute; margin: 0; z-index: 3; }
  .ovf input { display: block; width: 100%; height: 100%; box-sizing: border-box; padding: 0 6px; margin: 0; border: 0; outline: none; background: transparent; color: transparent; caret-color: #ffff00; font-size: 16px; -webkit-appearance: none; border-radius: 0; }
  #loginForm { left: 317px; top: 280px; width: 200px; height: 22px; }
  #chatForm { left: 7px; top: 455px; width: 506px; height: 18px; display: none; }
  #rotate { display: none; position: fixed; left: 0; right: 0; top: 0; padding: 6px; background: rgba(0,0,0,0.75); color: #ffb040; font: bold 14px Arial, sans-serif; text-align: center; z-index: 5; pointer-events: none; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
</style>
</head>
<body>
<div id="rotate">Turn your phone sideways for a bigger view</div>
<form id="kbform" autocomplete="off"><input id="kb" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></form>
<div id="wrap">
  <canvas id="gl" width="512" height="334"></canvas>
  <canvas id="ui" width="765" height="503"></canvas>
  <form id="loginForm" class="ovf" autocomplete="off"><input id="loginField" type="text" maxlength="12" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Username"></form>
  <form id="chatForm" class="ovf" autocomplete="off"><input id="chatField" type="text" maxlength="80" autocorrect="on" spellcheck="false" enterkeyhint="send" aria-label="Chat"></form>
</div>
<script src="lib/three.min.js"></script>
<script src="js/data.js?v=36"></script>
<script src="js/icons.js?v=36"></script>
<script src="js/models.js?v=36"></script>
<script src="js/world.js?v=36"></script>
<script src="js/game.js?v=36"></script>
<script src="js/ui.js?v=36"></script>
<script src="js/main.js?v=36"></script>
</body>
</html>
